name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'c0x12c'
    steps:
      # Use the org GitHub App token, NOT GITHUB_TOKEN: a tag/release created with
      # GITHUB_TOKEN does not trigger downstream workflows, so publish-to-pypi.yml
      # (on: push tags v*) would never fire. The App token makes the tag push a
      # real event that triggers publishing.
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
