name: Check Pull Request

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'poetry.lock'
      # pyproject.toml carries [tool.pytest.ini_options], so a change to how pytest
      # resolves or collects tests was never run by pytest - the same self-gating hole
      # the workflow entry below exists to close.
      - 'pyproject.toml'
      # This file gates itself. Without it, a change to the matrix below is never
      # run by the matrix it edits - measured on PR #120, where widening the Python
      # range triggered only the changelog check and no tests at all.
      - '.github/workflows/pull_request.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The full range pyproject.toml declares. Testing a subset meant 3.11 and 3.13
        # were supported on paper and verified nowhere; a consumer pipeline was running
        # 3.11. Keep this list and the pyproject constraint in step.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Cache Poetry virtual environment
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          poetry install

      - name: Run tests
        run: |
          poetry run pytest tests/unit/ tests/filter_process/
